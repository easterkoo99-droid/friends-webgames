<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f3f6">
<meta name="color-scheme" content="dark light">
<title>게임방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 폰트: 영문·숫자 Geist, 한글 Pretendard Variable, 작은 라벨 IBM Plex Mono (모두 무료 오픈 폰트) -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d11; --card: #10141a; --card-solid: #10141a; --soft: rgba(255, 255, 255, .045);
    --line: #1f262f; --line2: #2b3440; --ink: #e7eaf0; --dim: #7f8997;
    --accent: #38bdf8; --accent-ink: #031017; --accent2: #818cf8;
    --ok: #34d399; --bad: #f0616d; --warn: #f5b942;
    --shadow: 0 0 0 1px rgba(255, 255, 255, .02), 0 14px 34px rgba(0, 0, 0, .5);
    --bg-art: linear-gradient(180deg, rgba(56, 189, 248, .07), transparent 260px);
    --r: 6px; --r-lg: 10px;
    --mono: 'IBM Plex Mono', 'Pretendard Variable', Pretendard, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --font: 'Geist', 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
    --display: var(--font);
  }
  [data-theme="light"] {
    --bg: #f1f3f6; --card: #ffffff; --card-solid: #ffffff; --soft: rgba(15, 23, 42, .04);
    --line: #dde2e9; --line2: #c9d0da; --ink: #131a24; --dim: #64707f;
    --accent: #0284c7; --accent-ink: #ffffff;
    --ok: #0f9f6e; --bad: #d93a4a; --warn: #c98a00;
    --shadow: 0 10px 28px rgba(20, 30, 60, .1);
    --bg-art: linear-gradient(180deg, rgba(2, 132, 199, .06), transparent 260px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); overscroll-behavior-y: none; }
  html, body { margin: 0; min-height: 100%; color: var(--ink); font-family: var(--font); font-size: 15.5px; line-height: 1.5; }
  body { background: transparent; }
  body::before { content: ''; position: fixed; inset: 0; z-index: -1; background: var(--bg-art); pointer-events: none; }
  button, input { font-family: inherit; font-size: inherit; color: inherit; }
  [hidden] { display: none !important; }
  h1, h2, h3 { margin: 0; line-height: 1.3; }
  h2 { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
  h3 { font-size: 15.5px; font-weight: 800; }
  .hint { color: var(--dim); font-size: 13.5px; margin: 6px 0 0; }
  .grow { flex: 1; }
  svg { display: block; }
  .mono, .eyebrow { font-family: var(--mono); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); font-weight: 500; }
  .eyebrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .eyebrow b { color: var(--accent); font-weight: 600; letter-spacing: .12em; }

  /* 버튼 / 입력 */
  .btn { border: 1px solid var(--line2); background: #171d25; color: var(--ink); border-radius: var(--r); padding: 11px 16px; font-weight: 700; cursor: pointer; touch-action: manipulation; transition: filter .15s, border-color .15s, background .15s; }
  [data-theme="light"] .btn { background: #f3f5f8; }
  .btn:hover:not(:disabled) { border-color: color-mix(in srgb, var(--accent) 55%, var(--line2)); }
  .btn:disabled { opacity: .38; cursor: default; }
  .btn.primary { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 24%, #0d1218), color-mix(in srgb, var(--accent) 14%, #0b0f14)); border-color: color-mix(in srgb, var(--accent) 65%, transparent); color: color-mix(in srgb, var(--accent) 55%, #fff); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 0 22px color-mix(in srgb, var(--accent) 12%, transparent); }
  [data-theme="light"] .btn.primary { background: var(--accent); color: #fff; border-color: transparent; box-shadow: none; }
  .btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 55%, transparent); background: color-mix(in srgb, var(--bad) 7%, transparent); }
  .btn.ghost { background: transparent; }
  .btn.small { padding: 6px 11px; font-size: 13.5px; }
  .btn.big { width: 100%; padding: 14px; font-size: 16px; }
  .iconbtn { width: 36px; height: 36px; border-radius: var(--r); border: 1px solid var(--line2); background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer; }
  .iconbtn svg { width: 18px; height: 18px; }
  input[type=text] { width: 100%; padding: 12px 13px; border-radius: var(--r); border: 1px solid var(--line2); background: rgba(0, 0, 0, .28); outline: none; }
  [data-theme="light"] input[type=text] { background: #fff; }
  input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 18px color-mix(in srgb, var(--accent) 18%, transparent); }
  input::placeholder { color: color-mix(in srgb, var(--dim) 70%, transparent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; box-shadow: var(--shadow); }
  .sec { padding: 2px 0 0; }
  .row { display: flex; gap: 8px; align-items: center; }

  /* 입장 */
  #entry { min-height: 100vh; display: flex; flex-direction: column; padding: 0 0 26px; max-width: 520px; margin: 0 auto; }
  .entry-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
  .brand svg { width: 26px; height: 26px; }
  .entry-actions { display: flex; gap: 6px; }
  .entry-hero { margin: 7vh 0 22px; padding: 0 18px; }
  .entry-hero h1 { font-weight: 800; font-size: clamp(32px, 9.5vw, 44px); line-height: 1.16; letter-spacing: -.025em; margin-top: 10px; }
  .entry-hero h1 em { font-style: normal; color: var(--accent); }
  .entry-hero p { margin: 12px 0 0; color: var(--dim); }
  .entry-panel { margin: auto 14px 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; box-shadow: var(--shadow); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line2); border-radius: var(--r); overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 10px 6px; font-weight: 700; color: var(--dim); cursor: pointer; font-size: 14px; }
  .seg button + button { border-left: 1px solid var(--line2); }
  .seg button.on { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  .field { margin-top: 14px; }
  .field > label { display: flex; justify-content: space-between; align-items: center; margin: 0 0 6px; }
  .linkbtn { border: 0; background: none; color: var(--accent); font-size: 12.5px; font-weight: 700; cursor: pointer; padding: 0; }
  .entry-panel .btn.big { margin-top: 14px; }
  #roomInput { text-transform: uppercase; letter-spacing: .5em; font-family: var(--mono); font-weight: 600; font-size: 26px; text-align: center; padding: 10px; color: var(--accent); }
  .err { color: var(--bad); font-size: 13.5px; min-height: 1.4em; margin: 10px 2px 0; text-align: center; }

  /* 방 */
  .sticky { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .topbar { position: relative; display: flex; align-items: center; gap: 8px; padding: 9px 12px; max-width: 1100px; margin: 0 auto; }
  .topbar .brand svg { width: 24px; height: 24px; }
  .codepill { display: flex; align-items: center; gap: 8px; padding: 6px 11px; border-radius: var(--r); border: 1px solid var(--line2); background: transparent; color: var(--dim); font-family: var(--mono); font-size: 10.5px; letter-spacing: .2em; cursor: pointer; }
  .codepill b { font-family: var(--mono); font-weight: 600; color: var(--accent); font-size: 15px; letter-spacing: .2em; }
  .menu { position: absolute; right: 12px; top: calc(100% + 6px); background: var(--card-solid); border: 1px solid var(--line2); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 5px; min-width: 200px; z-index: 60; }
  .menu button { display: block; width: 100%; text-align: left; padding: 11px 11px; border: 0; background: none; border-radius: var(--r); font-weight: 600; cursor: pointer; }
  .menu button:hover { background: var(--soft); }
  .menu button.danger { color: var(--bad); }
  #pluginBar:empty { display: none; }
  #pluginBar > div { padding-left: max(12px, calc((100vw - 1100px) / 2 + 12px)); padding-right: max(12px, calc((100vw - 1100px) / 2 + 12px)); }
  .layout { display: grid; grid-template-columns: 1fr; gap: 12px; max-width: 1100px; margin: 0 auto; padding: 12px 12px calc(var(--dock, 130px) + 16px); }
  #room[data-view="chat"] .layout { padding-bottom: calc(var(--dock, 56px) + 12px); }
  .main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .main > .eyebrow { margin: 0 0 -6px; }
  #lobby > * + * { margin-top: 12px; }
  .chatcol { min-width: 0; }
  .chatbox { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); display: flex; flex-direction: column; height: calc(100vh - 250px); min-height: 300px; overflow: hidden; box-shadow: var(--shadow); }
  .chathead.eyebrow { margin: 0; }
  .chathead { padding: 9px 13px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  .chatlog { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .msg { font-size: 14.5px; word-break: break-word; background: var(--soft); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 10px; align-self: flex-start; max-width: 90%; }
  .msg.mine { align-self: flex-end; background: color-mix(in srgb, var(--accent) 11%, transparent); border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); }
  .msg .who { font-weight: 800; margin-right: 6px; font-size: 12.5px; }
  .msg.sys { align-self: stretch; background: transparent; border: 0; border-left: 2px solid var(--line2); border-radius: 0; color: var(--dim); font-size: 12.5px; padding: 1px 9px; max-width: 100%; }
  .tag { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line2); color: var(--dim); margin-right: 5px; }
  .chatform { display: flex; gap: 8px; padding: 9px; border-top: 1px solid var(--line); }
  .chatform input { flex: 1; }

  .players { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
  .players::-webkit-scrollbar { display: none; }
  .pl { flex: 0 0 auto; width: 106px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 9px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); text-align: left; position: relative; }
  .pl::before { content: ''; position: absolute; left: 0; top: 9px; bottom: 9px; width: 2px; background: var(--pc, var(--line2)); border-radius: 2px; }
  .pl .av { width: 34px; height: 34px; border-radius: var(--r); display: grid; place-items: center; font-size: 20px; background: var(--soft); border: 1px solid var(--line2); }
  .pl .nmc { display: block; font-weight: 800; font-size: 12.5px; max-width: 88px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl .st { color: var(--dim); font-size: 11px; line-height: 1.25; }
  .pl.me { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); cursor: pointer; }
  .pl.ready .st { color: var(--ok); }
  .pl .hostmark { position: absolute; right: 7px; top: 9px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); padding: 0 5px; border-radius: 3px; }
  .pl.off { opacity: .45; }
  .pl.lead { border-color: #d6a93a; }

  .gamegrid { display: grid; grid-template-columns: 1fr; gap: 8px; margin: 8px 0 0; }
  .gcard { position: relative; text-align: left; display: grid; grid-template-columns: auto 1fr auto; column-gap: 12px; row-gap: 2px; align-items: center; padding: 13px 14px 13px 16px; border-radius: var(--r-lg); cursor: pointer; border: 1px solid var(--line); background: var(--card); transition: border-color .15s, background .15s; overflow: hidden; }
  .gcard::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gc); opacity: .55; }
  .gcard.locked { cursor: default; }
  .gcard.locked:not(.on) { opacity: .62; }
  .lockhint { display: flex; align-items: center; gap: 8px; margin: 8px 0 0; padding: 9px 12px; border: 1px solid var(--line2); border-radius: var(--r); font-size: 13.5px; color: var(--dim); background: var(--soft); }
  .gcard.on { border-color: color-mix(in srgb, var(--gc) 70%, var(--line)); background: linear-gradient(90deg, color-mix(in srgb, var(--gc) 13%, var(--card)), var(--card) 70%); box-shadow: 0 0 24px color-mix(in srgb, var(--gc) 14%, transparent); }
  .gcard.on::before { opacity: 1; }
  .gcard .gtop { display: contents; }
  .gcard .ge { grid-row: 1 / span 3; font-size: 30px; line-height: 1; }
  .gcard .gpill { grid-column: 3; grid-row: 1; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; color: var(--gc); border: 1px solid color-mix(in srgb, var(--gc) 45%, transparent); padding: 2px 7px; border-radius: 3px; }
  .gcard .gn { grid-column: 2; grid-row: 1; font-size: 16.5px; font-weight: 800; letter-spacing: -.01em; }
  .gcard .gd { grid-column: 2 / span 2; grid-row: 2; font-size: 13px; color: var(--dim); }
  .gcard .gpick { grid-column: 2 / span 2; grid-row: 3; font-family: var(--mono); font-size: 10px; letter-spacing: .16em; color: var(--gc); text-transform: uppercase; }
  [data-theme="light"] .gcard .gpill, [data-theme="light"] .gcard .gpick { color: color-mix(in srgb, var(--gc) 60%, #0b1620); }
  .rules { margin: 10px 0 0; padding-left: 18px; font-size: 14px; }
  .rules li { margin: 5px 0; }

  /* 하단: 준비/시작 버튼 바 + 탭 바를 하나로 묶어 고정해요 (따로 띄우면 사이에 틈이 생겼어요) */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 36; background: var(--bg); border-top: 1px solid var(--line2); padding-bottom: env(safe-area-inset-bottom); }
  .hubbar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; padding: 9px 12px; max-width: 1100px; margin: 0 auto; }
  .hubbar .btn { flex: 1 1 0; max-width: 220px; }
  .hubbar.slim { padding: 6px 12px; gap: 6px; }
  .hubbar.slim .btn { padding: 7px 10px; font-size: 13.5px; }
  .hbnote { width: 100%; text-align: center; font-size: 12px; color: var(--dim); }
  .tabbar { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); }
  .tabbar button { border: 0; background: transparent; padding: 13px 0; font-weight: 700; color: var(--dim); position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 14px; }
  .tabbar button + button { border-left: 1px solid var(--line); }
  .tabbar button svg { width: 18px; height: 18px; }
  .tabbar button.on { color: var(--accent); box-shadow: inset 0 2px 0 var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .tabbar i { background: var(--bad); color: #fff; font-style: normal; font-family: var(--mono); font-size: 10.5px; font-weight: 600; padding: 0 6px; border-radius: 3px; }
  .guidecol { display: none; min-width: 0; }
  #room[data-view="guide"] .guidecol { display: block; }
  #room[data-view="guide"] .main, #room[data-view="guide"] .chatcol, #room[data-view="guide"] .hubbar { display: none; }
  #room[data-view="guide"] .layout { padding-bottom: calc(var(--dock, 56px) + 12px); }
  #room[data-view="game"] .chatcol { display: none; }
  #room[data-view="chat"] .main, #room[data-view="chat"] .hubbar { display: none; }
  #room[data-view="chat"] .chatbox { height: calc(100vh - var(--top, 64px) - var(--dock, 56px) - 24px); height: calc(100dvh - var(--top, 64px) - var(--dock, 56px) - 24px); }

  @media (min-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr) 350px; padding-bottom: calc(var(--dock, 80px) + 16px); align-items: start; }
    #room[data-view="game"] .chatcol, #room[data-view="chat"] .chatcol, #room[data-view="chat"] .main { display: block; }
    #room[data-view="chat"] .hubbar, #room[data-view="guide"] .hubbar { display: flex; }
    #room[data-view="guide"] .chatcol, #room[data-view="guide"] .main { display: block; }
    .guidecol, #room[data-view="guide"] .guidecol { display: none; }
    .chatcol { position: sticky; top: 74px; }
    .chatbox, #room[data-view="chat"] .chatbox { height: calc(100vh - var(--top, 64px) - var(--dock, 70px) - 28px); }
    .tabbar { display: none; }
    .gamegrid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  }

  /* 알림 / 모달 */
  .toast { position: fixed; left: 50%; bottom: calc(var(--dock, 120px) + 14px); transform: translateX(-50%); background: #e7eaf0; color: #0b0d11; padding: 9px 16px; border-radius: var(--r); z-index: 90; max-width: 90%; font-size: 13.5px; font-weight: 700; box-shadow: var(--shadow); }
  .banner { position: fixed; top: 0; left: 0; right: 0; z-index: 95; background: var(--warn); color: #1c1400; text-align: center; padding: 6px; font-size: 13.5px; font-weight: 800; }
  .overlay { position: fixed; inset: 0; background: rgba(3, 4, 8, .7); backdrop-filter: blur(3px); z-index: 80; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: var(--card-solid); border: 1px solid var(--line2); border-radius: var(--r-lg); padding: 20px; width: 100%; max-width: 430px; max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow); }
  .modal.wide { max-width: 640px; }
  .modal h3 { margin-bottom: 12px; font-size: 18px; }
  /* 게임 설명 시트 */
  .help { display: flex; flex-direction: column; gap: 12px; }
  .hp-head { display: flex; gap: 12px; align-items: center; }
  .hp-head .ge { font-size: 40px; line-height: 1; }
  .hp-three { display: flex; flex-direction: column; gap: 8px; }
  .hp-three > div { display: flex; gap: 11px; align-items: flex-start; padding: 11px 12px; border: 1px solid var(--line2); border-radius: var(--r); background: var(--soft); font-size: 16px; line-height: 1.5; }
  .hp-three .n { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-family: var(--mono); font-weight: 700; display: grid; place-items: center; font-size: 14px; margin-top: 1px; }
  .hp-three b, .hp-lines b { color: var(--accent); }
  .hp-lines { margin: 8px 0 0; padding-left: 20px; font-size: 15.5px; line-height: 1.55; }
  .hp-lines li { margin: 7px 0; }
  .hp-item { border: 1px solid var(--line); border-left: 4px solid var(--cc, var(--line2)); border-radius: var(--r-lg); background: var(--card); padding: 12px 14px 13px; margin-top: 10px; }
  .hp-item .t { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 18px; }
  .hp-item .em { font-size: 30px; line-height: 1; }
  .hp-item .num { font-family: var(--mono); color: var(--cc); font-size: 20px; margin-right: 2px; }
  .hp-item .sub { color: var(--dim); font-size: 13px; font-weight: 700; margin-left: auto; }
  .hp-text { font-size: 15.5px; line-height: 1.55; margin-top: 7px; }
  .hp-ex, .hp-tip { margin-top: 8px; padding: 8px 10px; border-radius: var(--r); font-size: 14.5px; line-height: 1.5; }
  .hp-ex { background: color-mix(in srgb, var(--cc, var(--accent)) 12%, transparent); }
  .hp-tip { background: var(--soft); color: var(--dim); }
  .hp-ex b, .hp-tip b { color: var(--ink); }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .note-ver { font-family: var(--mono); font-size: 14px; color: var(--accent); letter-spacing: .08em; }
  .note-date { font-family: var(--mono); color: var(--dim); font-size: 11.5px; margin-left: 8px; }
  .note ul { margin: 6px 0 14px; padding-left: 18px; font-size: 14px; }
</style>
</head>
<body>
<div class="banner" id="banner" hidden>연결이 끊겼어요. 다시 연결하는 중…</div>
<div class="toast" id="toast" hidden></div>
<div class="banner" id="mismatch" hidden style="top:auto;bottom:0">⚠️ 서버 파일(hub.js)과 화면 파일(index.html)의 버전이 달라요. 올린 파일을 모두 다시 올려 주세요.</div>

<!-- 입장: 큰 제목 + 아래에서 올라온 패널. 초대 링크로 오면 ‘코드로 입장’이 바로 열려요 -->
<main class="screen" id="entry">
  <div class="entry-top">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" style="color:var(--accent)"><rect x="2.5" y="2.5" width="19" height="19" rx="4"/><circle cx="9" cy="10" r="1.7" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="1.7" fill="currentColor" stroke="none"/><path d="M8.2 15.4c2.3 2.1 5.3 2.1 7.6 0"/></svg>
      게임방
    </div>
    <div class="entry-actions">
      <button class="btn small ghost" id="entryNote">패치노트</button>
      <button class="btn small ghost" id="entryTheme">☀️</button>
    </div>
  </div>
  <div class="entry-hero">
    <div class="eyebrow"><span>ROOM ACCESS</span><b>ONLINE</b></div>
    <h1>오늘은<br><em>뭐 하고</em> 놀까?</h1>
    <p>링크 하나면 친구들이 바로 모여요.</p>
  </div>
  <section class="entry-panel">
    <div class="seg" id="entrySeg">
      <button data-mode="create" class="on">새 방 만들기</button>
      <button data-mode="join">코드로 입장</button>
    </div>
    <div class="field">
      <label for="nick"><span class="mono">NICKNAME</span><button class="linkbtn" id="btnDice" type="button">🎲 다시 뽑기</button></label>
      <input type="text" id="nick" maxlength="12" autocomplete="off" placeholder="닉네임">
    </div>
    <div id="paneCreate">
      <button class="btn primary big" id="btnCreate">방 만들기</button>
    </div>
    <div id="paneJoin" hidden>
      <div class="field">
        <label for="roomInput"><span class="mono">ROOM CODE · 4자리</span></label>
        <input type="text" id="roomInput" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="----">
      </div>
      <button class="btn primary big" id="btnJoin">입장하기</button>
    </div>
    <div class="err" id="entryErr"></div>
  </section>
</main>

<!-- 방 -->
<div class="screen" id="room" data-view="game" hidden>
  <div class="sticky" id="stickyTop">
    <header class="topbar">
      <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" style="color:var(--accent)"><rect x="2.5" y="2.5" width="19" height="19" rx="4"/><circle cx="9" cy="10" r="1.7" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="1.7" fill="currentColor" stroke="none"/><path d="M8.2 15.4c2.3 2.1 5.3 2.1 7.6 0"/></svg></div>
      <button class="codepill" id="btnCode" title="눌러서 방 코드 복사">ROOM <b id="roomCode">----</b></button>
      <span class="grow"></span>
      <button class="iconbtn" id="btnShare" title="초대 링크 보내기" aria-label="초대 링크 보내기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.3 10.8l7.4-4.4M8.3 13.2l7.4 4.4"/></svg></button>
      <button class="iconbtn" id="btnMenu" title="메뉴" aria-label="메뉴"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
      <div class="menu" id="menu" hidden>
        <button id="btnGuide">📖 게임 설명</button>
        <button id="btnNote">📋 패치노트</button>
        <button id="btnTheme">☀️ 밝은 화면으로</button>
        <button id="btnLeave" class="danger">🚪 방에서 나가기</button>
      </div>
    </header>
    <div id="pluginBar"></div>
  </div>
  <div class="layout" id="layout">
    <section class="main" id="mainCol">
      <div class="eyebrow"><span>PLAYERS</span><b id="pcount">0</b></div>
      <div class="players" id="players"></div>
      <div id="lobby" hidden></div>
      <div id="gameHost" hidden></div>
    </section>
    <section class="guidecol" id="guideCol"><div id="guide"></div></section>
    <aside class="chatcol" id="chatCol">
      <div class="chatbox">
        <div class="chathead eyebrow"><span>CHAT</span><b>ALL</b></div>
        <div class="chatlog" id="chatlog"></div>
        <form class="chatform" id="chatForm" autocomplete="off">
          <input type="text" id="chatInput" maxlength="200" placeholder="메시지 입력" autocomplete="off">
          <button class="btn primary" type="submit">전송</button>
        </form>
      </div>
    </aside>
  </div>
  <div class="dock" id="dock">
  <div class="hubbar" id="hubBar"></div>
  <nav class="tabbar" id="tabbar">
    <button data-tab="game" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="4"/><path d="M8 10v4M6 12h4"/><circle cx="16" cy="11" r=".8" fill="currentColor"/><circle cx="18" cy="13" r=".8" fill="currentColor"/></svg>게임</button>
    <button data-tab="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>채팅<i id="unread" hidden>0</i></button>
    <button data-tab="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5C4.7 19 4 18.3 4 17.5zM20 5.5c0-.8-.7-1.5-1.5-1.5H13v15h5.5c.8 0 1.5-.7 1.5-1.5z"/></svg>설명</button>
  </nav>
  </div>
</div>

<div class="overlay" id="overlay" hidden><div class="modal" id="modal"></div></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/games/spyfall.js"></script>
<script src="/games/village.js"></script>
<script src="/games/letter.js"></script>
<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => document.querySelectorAll(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 저장 불가 환경은 무시 */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* noop */ } },
  };
  const K = { token: 'gr_token', room: 'gr_room', name: 'gr_name', theme: 'gr_theme' };

  /* 패치노트: 위에 새 항목을 추가하면 돼요 */
  const PATCHNOTES = [
    { v: '2.0', date: '26-11-10', lines: [
      '게임방으로 개편했어요. 닉네임은 자동으로 채워지고, 버튼 한 번으로 방을 만들 수 있어요.',
      '대기실에서 게임 카드를 눌러 바로 게임을 바꿀 수 있어요. 점수와 👑는 방에서 계속 이어져요.',
      '휴대폰에서는 아래 탭(게임/채팅)으로 쓰고, PC에서는 채팅이 오른쪽에 같이 보여요.',
      '스파이폴이 ‘우리가 있는 곳은?’으로 이름이 바뀌었어요. 규칙은 그대로예요.',
      '새 게임 ‘오늘도 이 마을엔 피가 흐른다’가 추가됐어요. 숨은 직업으로 악마를 찾는 5~10명 추리 게임이에요.',
      '앞으로 게임을 계속 추가할 수 있게 구조를 바꿨어요.',
      '이제 방장(방을 만든 사람)만 게임을 고르고 바꿀 수 있어요. 방장이 나가면 다음 사람이 방장이 돼요.',
      '새 게임 ‘밀서 대작전’이 추가됐어요. 카드 한 장씩 내며 상대를 탈락시키는 2~4인 카드 추리 게임이에요.',
      '화면 디자인을 새로 바꿨어요. 수사 파일 같은 어두운 화면이 기본이고, 메뉴(⋯)에서 밝은 화면으로 바꿀 수 있어요.',
    ] },
  ];

  /* 자동 닉네임 */
  const ADJ = ['용감한', '졸린', '배고픈', '수상한', '느긋한', '반짝이는', '엉뚱한', '씩씩한', '심심한', '든든한', '눈치빠른', '수줍은'];
  const ANI = ['호랑이', '고양이', '수달', '펭귄', '너구리', '다람쥐', '부엉이', '고래', '여우', '판다', '오리', '토끼'];
  const pickOf = (a) => a[Math.floor(Math.random() * a.length)];
  const randomNick = () => (pickOf(ADJ) + pickOf(ANI)).slice(0, 12);

  const socket = io();
  const call = (ev, data) => new Promise((res) => socket.emit(ev, data || {}, res));

  const PROTO = 5;           // 서버(hub.js)와 같아야 해요
  let S = null;              // 서버가 보내 주는 방 상태
  let offset = 0;            // 서버 시각과의 차이
  let leaderIds = new Set();
  let view = 'game';         // 모바일 탭: 'game' | 'chat'
  let unread = 0;
  let mounted = null;        // 지금 화면에 올라간 게임 { id, no }
  let entering = false;
  let booting = false;
  let lastSelected = null;   // 대기실에서 마지막으로 그린 게임 선택       // 저장된 방으로 자동 재접속을 시도하는 중

  /* ───────── 공통 도우미 ───────── */
  let toastTimer = null;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
  }
  function openModal(html, wide) { $('#modal').innerHTML = html; $('#modal').classList.toggle('wide', !!wide); $('#overlay').hidden = false; }
  function closeModal() { $('#overlay').hidden = true; $('#modal').innerHTML = ''; }
  $('#overlay').onclick = (e) => { if (e && e.target && e.target.id === 'overlay') closeModal(); };

  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    $('#btnTheme').textContent = t === 'dark' ? '☀️ 밝은 화면으로' : '🌙 어두운 화면으로';
    $('#entryTheme').textContent = t === 'dark' ? '☀️' : '🌙';
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = t === 'dark' ? '#0b0d11' : '#f1f3f6';
    ls.set(K.theme, t);
  }
  function toggleTheme() { applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); }
  function showNotes() {
    openModal(`<h3>패치노트</h3><div class="note">${PATCHNOTES.map((n) => `<div><span class="note-ver">${esc(n.v)}</span><span class="note-date">${esc(n.date)}</span><ul>${n.lines.map((l) => `<li>${esc(l)}</li>`).join('')}</ul></div>`).join('')}</div><div class="actions"><button class="btn primary" id="mClose">닫기</button></div>`);
    $('#mClose').onclick = closeModal;
  }

  const pById = (id) => (S ? S.players.find((p) => p.id === id) : null);
  // 게임은 방장만 고르고 바꿔요. 서버가 보낸 잠금 표시에 기대지 않고, 방장(hostId)이 나인지로 직접 판단해요.
  const isLocked = () => !!S && S.hostOnly !== false && S.hostId !== S.you;
  const crown = (id) => (leaderIds.has(id) ? '👑' : '');
  const nm = (p) => (p ? `<span class="nmc" style="color:${esc(p.color)};font-weight:800">${esc(p.avatar)} ${esc(p.name)}${crown(p.id)}</span>` : '?');

  /* ───────── 입장 ───────── */
  const params = new URLSearchParams(location.search);
  const urlRoom = (params.get('room') || '').toUpperCase().slice(0, 4);

  function showEntry(msg) {
    $('#entry').hidden = false;
    $('#room').hidden = true;
    $('#entryErr').textContent = msg || '';
    S = null;
    unmountGame();
  }
  function showRoom() {
    $('#entry').hidden = true;
    $('#room').hidden = false;
  }
  function saveSession(r, name) {
    ls.set(K.token, r.token);
    ls.set(K.room, r.room);
    if (name) ls.set(K.name, name);
    try { history.replaceState(null, '', `?room=${r.room}`); } catch (e) { /* noop */ }
  }
  async function enter(ev, extra) {
    if (entering) return;
    const name = $('#nick').value.trim();
    if (!name) { $('#entryErr').textContent = '닉네임을 입력해 주세요.'; return; }
    entering = true;
    $('#entryErr').textContent = '';
    const r = await call(ev, { name, ...extra });
    entering = false;
    if (!r || !r.ok) { $('#entryErr').textContent = (r && r.error) || '연결에 실패했어요. 잠시 후 다시 시도해 주세요.'; return; }
    saveSession(r, name);
    $('#chatlog').innerHTML = '';
    setView('game');
    showRoom();
  }
  let mode = 'create';
  function setMode(m) {
    mode = m;
    $('#paneCreate').hidden = m !== 'create';
    $('#paneJoin').hidden = m !== 'join';
    $$('[data-mode]').forEach((b) => b.classList.toggle('on', b.dataset.mode === m));
    $('#entryErr').textContent = '';
  }
  $$('[data-mode]').forEach((b) => { b.onclick = () => setMode(b.dataset.mode); });
  $('#btnCreate').onclick = () => enter('create');
  $('#btnJoin').onclick = () => {
    const code = $('#roomInput').value.trim().toUpperCase();
    if (code.length < 4) { $('#entryErr').textContent = '방 코드 4자리를 입력해 주세요.'; return; }
    enter('join', { room: code });
  };
  $('#roomInput').onkeydown = (e) => { if (e.key === 'Enter') $('#btnJoin').onclick(); };
  $('#nick').onkeydown = (e) => { if (e.key === 'Enter') (mode === 'join' ? $('#btnJoin') : $('#btnCreate')).onclick(); };
  $('#btnDice').onclick = () => { $('#nick').value = randomNick(); };
  $('#entryNote').onclick = showNotes;
  $('#entryTheme').onclick = toggleTheme;
  $('#btnNote').onclick = showNotes;
  $('#btnGuide').onclick = () => { $('#menu').hidden = true; showGuide(); };
  $('#btnTheme').onclick = toggleTheme;

  async function tryRejoin() {
    const token = ls.get(K.token), room = ls.get(K.room);
    if (!token || !room) return false;
    if (urlRoom && urlRoom !== room) return false;   // 다른 방의 초대 링크로 들어왔으면 새로 입장해요
    const r = await call('rejoin', { token, room });
    if (r && r.ok) { saveSession(r); showRoom(); return true; }
    ls.del(K.token); ls.del(K.room);
    return false;
  }

  /* ───────── 상단 ───────── */
  $('#btnShare').onclick = async () => {
    if (!S) return;
    const url = `${location.origin}/?room=${S.code}`;
    if (navigator.share) {
      try { await navigator.share({ title: '게임방', text: `게임방에 들어와! 방 코드 ${S.code}`, url }); } catch (e) { /* 공유 취소 */ }
      return;
    }
    try { await navigator.clipboard.writeText(url); toast('초대 링크를 복사했어요!'); } catch (e) { toast(url); }
  };
  const closeMenu = () => { $('#menu').hidden = true; };
  $('#btnMenu').onclick = (e) => { if (e && e.stopPropagation) e.stopPropagation(); $('#menu').hidden = !$('#menu').hidden; };
  $('#menu').onclick = closeMenu;
  if (typeof document.addEventListener === 'function') document.addEventListener('click', (e) => { if (!$('#menu').hidden && !(e && e.target && e.target.closest && e.target.closest('#menu'))) closeMenu(); });
  $('#btnCode').onclick = async () => {
    if (!S) return;
    try { await navigator.clipboard.writeText(S.code); toast(`방 코드 ${S.code}를 복사했어요!`); } catch (e) { toast(`방 코드: ${S.code}`); }
  };
  $('#btnLeave').onclick = () => {
    if (!confirm('방에서 나갈까요?')) return;
    socket.emit('leave');
    ls.del(K.token); ls.del(K.room);
    try { history.replaceState(null, '', '/'); } catch (e) { /* noop */ }
    showEntry('');
  };

  /* ───────── 플레이어 / 대기실 / 하단 버튼 ───────── */
  function renderPlayers() {
    $('#pcount').textContent = String(S.players.length);
    $('#players').innerHTML = S.players.map((p) => {
      let st = '';
      if (!p.connected) st = '연결 끊김';
      else if (S.phase === 'lobby' || S.finished) st = p.ready ? '준비 ✓' : '대기';
      else st = p.inGame ? '참가 중' : (p.ready ? '다음 판 참가' : '관전');
      const cls = ['pl', p.id === S.you ? 'me' : '', p.ready && (S.phase === 'lobby' || S.finished) ? 'ready' : '', p.connected ? '' : 'off', leaderIds.has(p.id) ? 'lead' : ''].filter(Boolean).join(' ');
      return `<div class="${cls}" style="--pc:${esc(p.color)}" ${p.id === S.you ? 'id="meChip" title="눌러서 닉네임 바꾸기"' : ''}>${p.id === S.hostId ? '<span class="hostmark">방장</span>' : ''}<span class="av">${esc(p.avatar)}</span><span class="nmc" style="color:${esc(p.color)}">${esc(p.name)}${crown(p.id)}</span><span class="st">${esc(st)}${p.score ? ` · ${p.score}점` : ''}${p.id === S.you ? ' · 나' : ''}</span></div>`;
    }).join('');
    const me = $('#meChip');
    if (me) me.onclick = renameModal;
  }
  function renameModal() {
    const p = pById(S.you);
    openModal('<h3>닉네임 바꾸기</h3><input type="text" id="renameInput" maxlength="12" autocomplete="off"><div class="err" id="renameErr"></div><div class="actions"><button class="btn" id="mCancel">취소</button><button class="btn primary" id="mSave">저장</button></div>');
    $('#renameInput').value = p.name;
    $('#renameInput').focus();
    $('#mCancel').onclick = closeModal;
    const save = async () => {
      const name = $('#renameInput').value.trim();
      if (!name) return;
      const r = await call('rename', { name });
      if (!r || !r.ok) { $('#renameErr').textContent = (r && r.error) || '바꾸지 못했어요.'; return; }
      ls.set(K.name, name);
      closeModal();
    };
    $('#mSave').onclick = save;
    $('#renameInput').onkeydown = (e) => { if (e.key === 'Enter') save(); };
  }

  let lobbyOpen = false;   // 방장이 ‘게임 바꾸기’로 게임 목록을 펼쳤는지 (평소에는 선택된 게임 하나만 보여요)
  function renderLobby() {
    const el = $('#lobby');
    if (S.phase !== 'lobby') { el.hidden = true; lobbyOpen = false; return; }
    el.hidden = false;
    const sel = S.games.find((g) => g.id === S.selected);
    const locked = isLocked();
    const host = pById(S.hostId);
    if (locked || S.games.length < 2) lobbyOpen = false;
    if (lastSelected !== S.selected) { lobbyOpen = false; lastSelected = S.selected; }
    const canChange = !locked && S.games.length > 1;
    const list = lobbyOpen ? S.games : [sel];
    const hint = locked
      ? `<div class="lockhint">🔒 <span><b>방장 ${host ? esc(host.name) : ''}님</b>이 게임을 골라요. ‘준비’만 눌러 주세요.</span></div>`
      : `<p class="hint">${lobbyOpen ? '하고 싶은 게임 카드를 눌러 고르세요.' : (S.games.length > 1 ? '이 게임으로 시작해요. 다른 게임을 하려면 ‘게임 바꾸기’를 누르세요.' : '새 게임이 추가되면 여기에서 고를 수 있어요.')}</p>`;
    const card = (g) => `<button class="gcard${g.id === S.selected ? ' on' : ''}${locked ? ' locked' : ''}" data-game="${esc(g.id)}" style="--gc:${esc(g.accent)}"><span class="gtop"><span class="ge">${esc(g.emoji)}</span><span class="gpill">${g.min}~${g.max}명</span></span><b class="gn">${esc(g.name)}</b><span class="gd">${esc(g.desc)}</span>${g.id === S.selected ? '<span class="gpick">SELECTED ✓</span>' : ''}</button>`;
    el.innerHTML = `<div class="sec"><div class="eyebrow"><span>LOBBY · ${lobbyOpen ? 'SELECT GAME' : 'GAME'}</span>${canChange ? `<button class="linkbtn" id="btnChange">${lobbyOpen ? '닫기' : '게임 바꾸기'}</button>` : ''}</div><h2>대기실</h2>
        ${hint}
        <div class="gamegrid" id="gameGrid">${list.map(card).join('')}</div></div>
      <div class="card"><div class="eyebrow"><span>RULES</span><b>${sel.min}–${sel.max} PLAYERS</b></div><h3>${esc(sel.emoji)} ${esc(sel.name)} 규칙</h3>
        <ul class="rules">${sel.rules.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>
        <p class="hint">친구들에게 방 코드 <b>${esc(S.code)}</b> 또는 초대 링크를 보내세요. ${sel.min}~${sel.max}명이 ‘준비’를 누르면 시작할 수 있어요.</p></div>`;
    $$('[data-game]').forEach((b) => {
      b.onclick = async () => {
        if (isLocked()) { toast('방장만 게임을 고를 수 있어요.'); return; }
        if (!lobbyOpen) { lobbyOpen = true; renderLobby(); return; }   // 선택된 카드를 눌러도 목록이 펼쳐져요
        const r = await call('select', { game: b.dataset.game });
        if (r && !r.ok) { toast(r.error); return; }
        lobbyOpen = false;
        renderLobby();
      };
    });
    const bc = $('#btnChange');
    if (bc) bc.onclick = () => { lobbyOpen = !lobbyOpen; renderLobby(); };
  }

  function renderHubBar() {
    const me = pById(S.you);
    if (!me) return;
    const sel = S.games.find((g) => g.id === S.selected);
    const lobbyLike = S.phase === 'lobby' || S.finished;
    let html = `<button class="btn ${me.ready ? '' : 'primary'}" id="hbReady">${me.ready ? '준비 취소' : (lobbyLike ? '준비' : '다음 판 준비')}</button>`;
    if (lobbyLike) html += `<button class="btn primary" id="hbStart" ${S.canStart ? '' : 'disabled'}>${S.finished ? '다시 하기' : '게임 시작'}</button>`;
    if (S.phase === 'game' && !isLocked()) html += '<button class="btn" id="hbSwitch">🔄 게임 바꾸기</button>';   // 방장만
    let note;
    if (lobbyLike) note = `${esc(sel.name)} · 준비 ${S.readyCount}명 (${sel.min}~${sel.max}명 필요)${me.ready ? '' : ' — 준비를 눌러 주세요'}${S.finished && isLocked() ? ' · 게임 바꾸기는 방장만 해요' : ''}`;
    else note = S.spectator ? '관전 중이에요. 준비를 눌러 두면 다음 판에 참가해요.' : `${esc(sel.name)} 진행 중`;
    const running = S.phase === 'game' && !S.finished;
    if (!running || S.spectator) html += `<div class="hbnote" id="hbNote">${note}</div>`;   // 게임 중에는 안내 문구를 줄여요
    $('#hubBar').className = `hubbar${running ? ' slim' : ''}`;
    $('#hubBar').innerHTML = html;
    $('#hbReady').onclick = () => socket.emit('ready');
    const st = $('#hbStart');
    if (st) st.onclick = async () => { const r = await call('start'); if (r && !r.ok) toast(r.error); };
    const sw = $('#hbSwitch');
    if (sw) sw.onclick = async () => {
      if (!S.finished && !confirm('진행 중인 게임을 멈추고 대기실로 돌아갈까요?')) return;
      const r = await call('lobby');
      if (r && !r.ok) toast(r.error);
    };
  }

  /* ───────── 게임 화면(플러그인) ───────── */
  const gameCtx = {
    host: () => $('#gameHost'),
    bar: () => $('#pluginBar'),
    act: (type, data) => call('act', { type, ...(data || {}) }),
    toast, esc, nm, pById, crown,
    openChat: () => setView('chat'),
    view: () => view,
    now: () => Date.now() + offset,
  };
  function unmountGame() {
    if (mounted) {
      const P = window.GAME_UI && window.GAME_UI[mounted.id];
      if (P && P.unmount) P.unmount();
      mounted = null;
    }
    $('#gameHost').innerHTML = '';
    $('#pluginBar').innerHTML = '';
  }
  function renderGame() {
    const host = $('#gameHost');
    if (S.phase !== 'game') { unmountGame(); host.hidden = true; return; }
    host.hidden = false;
    const P = window.GAME_UI && window.GAME_UI[S.selected];
    if (!P) { host.innerHTML = '<div class="card">이 게임 화면을 불러오지 못했어요. 새로고침해 주세요.</div>'; return; }
    if (!mounted || mounted.id !== S.selected || mounted.no !== S.gameNo) {
      unmountGame();
      P.mount(gameCtx);
      mounted = { id: S.selected, no: S.gameNo };
    }
    P.update(S, S.game);
  }

  /* ───────── 채팅 / 탭 ───────── */
  const chatlog = $('#chatlog');
  function chatLine(m) {
    const d = document.createElement('div');
    if (m.sys) { d.className = 'msg sys'; d.textContent = m.text; return d; }
    d.className = S && m.pid === S.you ? 'msg mine' : 'msg';
    const who = document.createElement('span');
    who.className = 'who';
    who.style.color = m.color;
    who.textContent = `${m.avatar} ${m.name}${crown(m.pid)}`;
    if (m.spectator) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = '관전'; d.append(t); }
    d.append(who, m.text);
    return d;
  }
  function addChat(m) {
    const atBottom = chatlog.scrollHeight - chatlog.scrollTop - chatlog.clientHeight < 60;
    chatlog.appendChild(chatLine(m));
    while (chatlog.children && chatlog.children.length > 150) chatlog.removeChild(chatlog.firstChild);
    if (atBottom || (S && m.pid === S.you)) chatlog.scrollTop = chatlog.scrollHeight;
    if (view !== 'chat' && !m.sys && S && m.pid !== S.you) { unread += 1; renderUnread(); }
  }
  function renderUnread() {
    const u = $('#unread');
    u.textContent = String(unread);
    u.hidden = unread === 0;
  }
  // ───── 게임 설명 시트: 지금 고른 게임의 3줄 요약, 진행 방법, 카드/직업 설명 ─────
  const fmt = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  function guideHTML() {
    const g = S && S.games.find((x) => x.id === S.selected);
    if (!g) return '';
    const h = g.help;
    let html = `<div class="help"><div class="card"><div class="eyebrow"><span>GUIDE</span><b>${g.min}–${g.max} PLAYERS</b></div><div class="hp-head"><span class="ge">${esc(g.emoji)}</span><div><h2>${esc(g.name)}</h2><div class="hint" style="margin:2px 0 0">${esc(g.desc)}</div></div></div></div>`;
    if (!h) return `${html}<div class="card"><ul class="hp-lines">${g.rules.map((r) => `<li>${fmt(r)}</li>`).join('')}</ul></div></div>`;
    html += `<div class="card"><div class="eyebrow"><span>3 LINES</span><b>QUICK</b></div><div class="hp-three">${h.summary.map((t, i) => `<div><span class="n">${i + 1}</span><span>${fmt(t)}</span></div>`).join('')}</div></div>`;
    (h.sections || []).forEach((sec) => { html += `<div class="card"><h3>${esc(sec.title)}</h3><ul class="hp-lines">${sec.lines.map((l) => `<li>${fmt(l)}</li>`).join('')}</ul></div>`; });
    (h.groups || []).forEach((grp) => {
      html += `<div class="card"><h3>${esc(grp.title)}</h3>${grp.items.map((it) => `<div class="hp-item" style="--cc:${esc(it.color || '#94a3b8')}"><div class="t"><span class="em">${esc(it.emoji || '')}</span><span>${it.badge ? `<span class="num">${esc(it.badge)}</span>` : ''}${esc(it.title)}</span>${it.sub ? `<span class="sub">${esc(it.sub)}</span>` : ''}</div><div class="hp-text">${fmt(it.text)}</div>${it.example ? `<div class="hp-ex"><b>📌 예시</b> ${fmt(it.example)}</div>` : ''}${it.tip ? `<div class="hp-tip"><b>💡 팁</b> ${fmt(it.tip)}</div>` : ''}</div>`).join('')}</div>`;
    });
    return `${html}</div>`;
  }
  let guideSig = '';
  function renderGuide(force) {
    if (!S) return;
    const sig = `${S.selected}|${S.games.map((g) => (g.help ? 1 : 0)).join('')}`;
    if (!force && sig === guideSig) return;
    guideSig = sig;
    $('#guide').innerHTML = guideHTML();
  }
  const isNarrow = () => !!(window.matchMedia && window.matchMedia('(max-width: 899px)').matches);
  function showGuide() {
    if (isNarrow()) { setView('guide'); return; }   // 폰: 설명 탭으로, PC: 팝업으로
    openModal(`${guideHTML()}<div class="actions"><button class="btn primary" id="guideClose">닫기</button></div>`, true);
    $('#guideClose').onclick = closeModal;
  }

  function setView(v) {
    view = v;
    $('#room').dataset.view = v;
    $$('[data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === v));
    if (v === 'guide') { renderGuide(true); if (typeof window.scrollTo === 'function') window.scrollTo(0, 0); }
    if (v === 'chat') { unread = 0; renderUnread(); chatlog.scrollTop = chatlog.scrollHeight; }
    if (S && S.phase === 'game') renderGame();   // 투표 바 등은 탭에 따라 모양이 달라져요
    syncTop();
  }
  $$('[data-tab]').forEach((b) => { b.onclick = () => setView(b.dataset.tab); });
  $('#chatForm').onsubmit = (e) => {
    e.preventDefault();
    const i = $('#chatInput');
    const text = i.value.trim();
    if (!text) return;
    socket.emit('chat', { text });
    i.value = '';
  };

  /* ───────── 서버 이벤트 ───────── */
  function syncTop() {
    const root = document.documentElement;
    if (!root.style || typeof root.style.setProperty !== 'function') return;
    const st = document.querySelector('#stickyTop');
    const dk = document.querySelector('#dock');
    if (st && st.offsetHeight) root.style.setProperty('--top', `${st.offsetHeight}px`);
    if (dk && dk.offsetHeight) root.style.setProperty('--dock', `${dk.offsetHeight}px`);   // 하단 바 높이에 맞춰 내용이 가려지지 않게
  }
  if (typeof ResizeObserver === 'function') { const ro = new ResizeObserver(() => syncTop()); ['#stickyTop', '#dock'].forEach((q) => { const e = document.querySelector(q); if (e) ro.observe(e); }); }
  if (typeof window.addEventListener === 'function') window.addEventListener('resize', syncTop);
  socket.on('state', (s) => {
    S = s;
    offset = s.now - Date.now();
    $('#mismatch').hidden = s.proto === PROTO;   // 서버 파일이 옛날 버전이면 경고
    const top = Math.max(0, ...s.players.map((p) => p.score));
    leaderIds = new Set(top >= 1 ? s.players.filter((p) => p.score === top).map((p) => p.id) : []);
    showRoom();
    $('#roomCode').textContent = s.code;
    renderPlayers();
    renderLobby();
    renderGame();
    renderHubBar();
    renderGuide(false);
    syncTop();
  });
  socket.on('chatlog', (list) => { chatlog.innerHTML = ''; list.forEach(addChat); chatlog.scrollTop = chatlog.scrollHeight; unread = 0; renderUnread(); });
  socket.on('chat', addChat);
  socket.on('kicked', () => {
    ls.del(K.token); ls.del(K.room);
    showEntry('다른 기기에서 접속해서 이 화면은 연결이 끊겼어요.');
  });
  socket.on('disconnect', () => { $('#banner').textContent = '연결이 끊겼어요. 다시 연결하는 중…'; $('#banner').hidden = false; });
  socket.on('connect', async () => {
    $('#banner').hidden = true;
    const ok = await tryRejoin();
    if (!ok) showEntry(S || booting ? '방을 찾을 수 없어요. (서버가 다시 시작되었거나 방이 닫혔어요)' : '');
    booting = false;
  });

  /* ───────── 시작 ───────── */
  applyTheme(ls.get(K.theme) || 'light');   // 기본은 밝은 화면 (메뉴에서 어둡게 바꾸면 기억해요)
  $('#nick').value = ls.get(K.name) || randomNick();
  if (urlRoom) { $('#roomInput').value = urlRoom; setMode('join'); }
  if (ls.get(K.token) && ls.get(K.room) && (!urlRoom || urlRoom === ls.get(K.room))) {
    // 저장된 방이 있으면 입장 카드를 깜빡이지 않고 바로 이어서 들어가요
    booting = true;
    $('#entry').hidden = true;
    $('#banner').textContent = '서버에 연결하는 중… (처음엔 30초쯤 걸릴 수 있어요)';
    $('#banner').hidden = false;
  }
})();
</script>
</body>
</html>
