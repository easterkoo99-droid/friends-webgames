<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>친구들과 웹게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Noto Sans KR', system-ui, sans-serif; background: #12151d; color: #e8e6df; }
  .wrap { min-height: 100%; display: grid; grid-template-rows: auto 1fr; }
  header { padding: 28px 24px 8px; text-align: center; }
  header h1 { margin: 0; font-size: 20px; font-weight: 500; letter-spacing: .04em; color: #aab0bd; }
  .games { display: grid; grid-template-columns: 1fr; }
  @media (min-width: 760px) { .games { grid-template-columns: 1fr 1fr; } }
  a.game {
    position: relative; display: flex; flex-direction: column; justify-content: center; gap: 12px;
    padding: 48px 36px; min-height: 320px; text-decoration: none; color: inherit; overflow: hidden;
    transition: filter .2s;
  }
  a.game:hover { filter: brightness(1.08); }
  a.game:focus-visible { outline: 3px solid #fff8; outline-offset: -8px; }
  a.game h2 { margin: 0; font-size: clamp(40px, 7vw, 64px); line-height: 1.05; }
  a.game p { margin: 0; max-width: 30ch; font-size: 16px; line-height: 1.6; }
  a.game .meta { font-size: 14px; opacity: .75; }
  a.game .go { margin-top: 10px; font-weight: 500; text-decoration: underline; text-underline-offset: 5px; }

  .bm { background: radial-gradient(900px 400px at 30% 0%, #1d4a41, transparent 70%), #0e2b26; color: #cfe0d6; }
  .bm h2 { font-family: 'Gowun Batang', serif; color: #e8c874; }
  .bm .frame { position: absolute; right: -30px; bottom: -30px; width: 190px; height: 230px; padding: 14px; transform: rotate(-6deg);
    background: linear-gradient(135deg, #e8c874, #a67c26 45%, #8d6a1d); box-shadow: 0 12px 28px #0008; opacity: .9; }
  .bm .frame i { display: block; width: 100%; height: 100%; background: repeating-linear-gradient(90deg, #7a2030 0 12px, #5c1623 12px 22px, #8a2635 22px 34px); }

  .sp { background: repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 2px, transparent 2px 6px), #232a38; color: #d6dbe6; }
  .sp h2 { font-family: 'Do Hyeon', sans-serif; font-weight: 400; color: #dccb94; letter-spacing: .04em; }
  .sp .stamp { position: absolute; right: 28px; bottom: 40px; transform: rotate(-12deg); font-family: 'Do Hyeon', sans-serif; font-size: 54px;
    color: #c0392f; border: 4px solid #c0392f; padding: 0 16px; border-radius: 6px; opacity: .8; letter-spacing: .1em; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>오늘은 어떤 게임을 할까요?</h1></header>
  <div class="games">
    <a class="game bm" href="/blindmarket.html">
      <h2>블라인드 마켓</h2>
      <p>가려진 작품에 비밀 입찰하는 눈치 경매. 비싸게 사도, 싸게 놓쳐도 아쉬워요.</p>
      <span class="meta">2~6명 · 10라운드 · 약 15분</span>
      <span class="go">경매장 입장하기</span>
      <div class="frame" aria-hidden="true"><i></i></div>
    </a>
    <a class="game sp" href="/spyfall.html">
      <h2>스파이폴</h2>
      <p>모두가 아는 장소를 단 한 사람만 몰라요. 질문으로 스파이를 가려내세요.</p>
      <span class="meta">3~8명 · 8분 · 말로 하는 심리전</span>
      <span class="go">작전 참가하기</span>
      <div class="stamp" aria-hidden="true">극비</div>
    </a>
  </div>
</div>
</body>
</html>
