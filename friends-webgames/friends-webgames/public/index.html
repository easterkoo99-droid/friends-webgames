<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>친구들과 웹게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Noto Sans KR', system-ui, sans-serif; background: #12151d; color: #e8e6df; }
  .wrap { min-height: 100%; display: grid; grid-template-rows: auto 1fr; }
  header { padding: 28px 24px 8px; text-align: center; }
  header h1 { margin: 0; font-size: 20px; font-weight: 500; letter-spacing: .04em; color: #aab0bd; }
  .games { display: grid; grid-template-columns: 1fr; }
  @media (min-width: 760px) { .games { grid-template-columns: 1fr 1fr; } }
  a.game {
    position: relative; display: flex; flex-direction: column; justify-content: center; gap: 12px;
    padding: 48px 36px; min-height: 320px; text-decoration: none; color: inherit; overflow: hidden;
    transition: filter .2s;
  }
  a.game:hover { filter: brightness(1.08); }
  a.game:focus-visible { outline: 3px solid #fff8; outline-offset: -8px; }
  a.game h2 { margin: 0; font-size: clamp(40px, 7vw, 64px); line-height: 1.05; }
  a.game p { margin: 0; max-width: 30ch; font-size: 16px; line-height: 1.6; }
  a.game .meta { font-size: 14px; opacity: .75; }
  a.game .go { margin-top: 10px; font-weight: 500; text-decoration: underline; text-underline-offset: 5px; }

  .qp { background: radial-gradient(800px 360px at 50% -60px, rgba(255,210,63,.22), transparent 70%), #0d1f35; color: #eef3fb; }
  .qp h2 { font-family: 'Black Han Sans', sans-serif; font-weight: 400; color: #ffd23f; text-shadow: 0 4px 0 rgba(0,0,0,.4); }
  .qp .bulbs { position: absolute; right: 24px; bottom: 34px; width: 170px; height: 110px; border-radius: 14px; background: #0a1b30; box-shadow: inset 0 0 0 2px #1d4a73; transform: rotate(5deg); }
  .qp .bulbs::before { content: ''; position: absolute; inset: -8px; border-radius: 20px; padding: 8px; -webkit-mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); mask-composite: exclude; background: radial-gradient(circle at 7px 7px, #ffd23f 3px, transparent 4px) 0 0 / 22px 22px; }
  .qp .bulbs i { position: absolute; inset: 0; display: grid; place-items: center; font-family: 'Black Han Sans', sans-serif; font-style: normal; font-size: 44px; color: #ffd23f; }
  .sp { background: repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 2px, transparent 2px 6px), #232a38; color: #d6dbe6; }
  .sp h2 { font-family: 'Do Hyeon', sans-serif; font-weight: 400; color: #dccb94; letter-spacing: .04em; }
  .sp .stamp { position: absolute; right: 28px; bottom: 40px; transform: rotate(-12deg); font-family: 'Do Hyeon', sans-serif; font-size: 54px;
    color: #c0392f; border: 4px solid #c0392f; padding: 0 16px; border-radius: 6px; opacity: .8; letter-spacing: .1em; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>오늘은 어떤 게임을 할까요?</h1></header>
  <div class="games">
    <a class="game qp" href="/quizparty.html">
      <h2>미니게임지옥</h2>
      <p>꽁꽁, 끝말잇기, 10초 맞추기, 업다운, 기억력, 반응속도 등 미니게임 12종 중 10종이 매 판 랜덤으로 뽑혀 이어지고, 점수를 합산해 순위를 가려요.</p>
      <span class="meta">2~12명 · 10라운드 · 약 15분</span>
      <span class="go">지옥 입장하기</span>
      <div class="bulbs" aria-hidden="true"><i>지옥</i></div>
    </a>
    <a class="game sp" href="/spyfall.html">
      <h2>스파이폴</h2>
      <p>모두가 아는 장소를 단 한 사람만 몰라요. 질문으로 스파이를 가려내세요.</p>
      <span class="meta">3~8명 · 8분 · 질문과 채팅으로 하는 심리전</span>
      <span class="go">작전 참가하기</span>
      <div class="stamp" aria-hidden="true">극비</div>
    </a>
  </div>
</div>
</body>
</html>
